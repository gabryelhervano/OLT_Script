; Configuração da operação. Copie para `config.ini` e preencha apenas o que
; ainda não estiver definido nas variáveis de ambiente.
;
; Nenhuma credencial real é necessária: sem valores, o script usa o modo
; simulado/DRY-RUN e as consultas locais.

[olt]
host = 127.0.0.1
porta = 22
usuario = operador
; Senha de login (a OLT pode autenticar por senha em vez de chave SSH).
; Deixe este arquivo com permissão 600: chmod 600 config.ini
senha =
; Comando para entrar no modo privilegiado. A MA5800 exige "enable"
; (o prompt passa de ">" para "#"). Deixe vazio se a CLI já entra direto.
enable = enable
; Senha do "enable", se for diferente da senha de login.
; senha_enable =
; Desliga a paginação da CLI na sessão (evita o prompt "--More--" nas
; listagens longas). A forma "temporary" vale só para esta sessão e não
; altera a configuração do equipamento.
screen_length = screen-length 0 temporary
chave = ""
interface = 0/1
; Portas GPON consultadas na listagem (todas, por padrão)
portas = 0-15
; Perfil de linha aplicado na recriacao da ONT (ont-lineprofile-id).
lineprofile = 11
; Perfil TR-069 aplicado na ONT (ont tr069-server-config). A linha e
; sempre executada: e o que associa a configuracao do TR-069 a OLT.
tr069profile = 1
; Perfil de WAN aplicado na ONT (ont wan-config). A linha e sempre
; executada, junto com o ont internet-config (ip-index 0).
wanprofile = 10
; Os demais valores (VLAN, prioridade, gemport, user-vlan e o srv-profile)
; sao descobertos no estado atual da ONT em cada execucao.
; ONTs que ja estao com o line-profile acima sao puladas (evita retrabalho
; e indisponibilidade da CPE). Use "sim" para reprovisiona-las mesmo assim.
reprovisionar_ja_configuradas =
; ONTs registradas como concluidas em registro_operacoes.json nao recebem
; comandos de novo e aparecem como JA_CONCLUIDA. Use "sim" (ou o argumento
; --reexecutar) para reprovisiona-las mesmo assim.
reexecutar =
; Antes de consultar o estado de cada ONT, a triagem descarta as que nao
; tem correspondencia na planilha (pelo serial ou pela descricao, que e o
; usuario PPPoE). Use "nao" para consultar todas as ONTs.
filtrar_por_planilha = sim
; Prefixos de serial das CPEs suportadas pela OLT (Huawei). As demais sao
; descartadas e o fluxo segue para a proxima ONT. Deixe vazio para nao
; filtrar. A comparacao ignora maiusculas e minusculas.
prefixos_serial = HW,4857,57
